# Arena sunucusunu Cloudflare'a kurar. Oyun kuralları index.html'den üretildiği için oyun değişince sunucu da güncellenir.
# Gerekli depo gizli değişkenleri (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN  : "Edit Cloudflare Workers" şablonuyla oluşturulan API anahtarı
#   CLOUDFLARE_ACCOUNT_ID : Cloudflare hesap kimliği (isteğe bağlı; yoksa anahtarın hesabı kullanılır)
# İsteğe bağlı depo değişkeni (Variables): GOOGLE_CLIENT_ID (Google ile giriş için)
name: Arena sunucusu

on:
  push:
    branches: [main]
    paths: ["server/**", "index.html", ".github/workflows/arena.yml"]
  workflow_dispatch:

concurrency:
  group: arena
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Motoru üret ve test et
        run: npm test
      - name: Cloudflare anahtarı var mı?
        id: key
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN tanımlı değil; test geçti ama kurulum atlandı."
          fi
      - name: Kur
        if: steps.key.outputs.skip != '1'
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: |
          # Telefondan yapıştırırken araya giren boşluk, satır sonu, tırnak ya da "Bearer" temizlenir.
          CLOUDFLARE_API_TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]"'"'" | sed 's/^Bearer//I')
          CLOUDFLARE_ACCOUNT_ID=$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]"'"'")
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          # Anahtarın kendisi yazılmaz; yalnızca uzunluğu ve biçimi.
          if printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -Eq '^[A-Za-z0-9_-]+$'; then FMT=uygun; else FMT=uygun-degil; fi
          echo "anahtar: ${#CLOUDFLARE_API_TOKEN} karakter, biçim $FMT; hesap kimliği: ${#CLOUDFLARE_ACCOUNT_ID} karakter"
          export CLOUDFLARE_API_TOKEN
          # Hesap kimliği yoksa wrangler anahtarın bağlı olduğu hesabı kendisi bulur.
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then export CLOUDFLARE_ACCOUNT_ID; fi
          if [ -n "$GOOGLE_CLIENT_ID" ]; then npx wrangler deploy --var "GOOGLE_CLIENT_ID:$GOOGLE_CLIENT_ID"; else npx wrangler deploy; fi
